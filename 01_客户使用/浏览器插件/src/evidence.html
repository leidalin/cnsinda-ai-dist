      .toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:#fff;border-bottom:1px solid #dcdfe6}

      @media(max-width:680px){.toolbar{align-items:flex-start;flex-direction:column}.title span{max-width:90vw}.actions{width:100%}.actions button{flex:1}iframe{height:calc(100vh - 145px)}}
